[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moqe-inference"
version = "0.1.0"
description = "Gateway for heterogeneous quantized LLM expert pools"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "anyio>=4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
moqe-serve = "moqe_serving.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
